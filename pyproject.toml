[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-dsa-lab"
version = "0.1.0"
description = "Public debt dynamics: decomposition, deterministic shocks, joint-shock fan chart, reconciliation to published tables"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7", "hypothesis>=6"]

[project.scripts]
sovereign-dsa-lab = "sovereigndsalab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
